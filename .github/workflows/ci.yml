name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Tests, types and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Tests (server + contract, no network)
        run: bun test

      - name: Typecheck (interface and server)
        run: bun run typecheck

      - name: Build the interface
        run: bun run build

  smoke:
    name: Smoke test the compiled executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the interface and compile the executable
        run: bun run compile

      - name: Run it and call the API
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path smoke | Out-Null
          Copy-Item dist-exe/ice.exe smoke/
          Copy-Item -Recurse static smoke/
          $process = Start-Process -FilePath "smoke/ice.exe" -ArgumentList "--no-window","--port","8799" -PassThru
          $ready = $false
          foreach ($attempt in 1..30) {
            Start-Sleep -Milliseconds 500
            try {
              $response = Invoke-WebRequest -Uri "http://127.0.0.1:8799/health" -UseBasicParsing -TimeoutSec 3
              if ($response.StatusCode -eq 200) { $ready = $true; break }
            } catch { }
          }
          if (-not $ready) { Stop-Process -Id $process.Id -Force; throw "the executable never answered /health" }
          $index = Invoke-WebRequest -Uri "http://127.0.0.1:8799/" -UseBasicParsing -TimeoutSec 5
          if ($index.Content -notmatch "Italian Capacity Explorer") { Stop-Process -Id $process.Id -Force; throw "the interface was not served" }
          Stop-Process -Id $process.Id -Force
          Write-Host "smoke test ok"
