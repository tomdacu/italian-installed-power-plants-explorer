name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Il solo permesso che checkout usa: il job non scrive nel repo, e un token
# amplo in un workflow che esegue codice di PR sarebbe solo un rischio extra.
permissions:
  contents: read

# Un push successivo annulla il run precedente dello stesso ref: due CI sulla
# stessa cima non dicono niente di diverso e sprecano runner. Le release
# (publish.yml/release.yml) tengono invece `cancel-in-progress: false` per
# motivi opposti — annullare a metà pubblicazione lascia stati incoerenti.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Nome storico del job: un rename cambierebbe il check richiesto dalle
    # branch protection. Il job ora impacchetta e prova anche il prodotto finito.
    name: Tests, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Tests (server + contract, no network)
        run: bun test

      - name: Typecheck (interface and server)
        run: bun run typecheck

      # Una sola esecuzione: `prepack` è `bun run build` e basta, e `build.ts`
      # committa già **entrambe** le cartelle (`dist/` e la sua copia integrale
      # `static/`) con un rename. Il vecchio doppio step ("build" + "prepack")
      # ricompilava la stessa cosa due volte senza aggiungere nulla.
      - name: Build the interface and the distributed package layout
        run: bun run prepack

      # Il prodotto finito, non i suoi pezzi: il server parte e serve la SPA
      # compilata. `--no-window` perché su un runner non c'è nulla da aprire.
      #
      # Il corpo di `GET /` si scarica **su file** e si controlla con `grep -q`
      # sul file: due comandi separati. Nella vecchia pipeline
      # (`curl … | grep -q`) l'uscita di curl passava per `grep -q`, che esce al
      # primo match, e un trasferimento interrotto — curl esce 18
      # (`partial file`) se il corpo è più corto del `Content-Length` — finiva
      # per sembrare un `grep` senza match: lo step poteva passare con una
      # pagina troncata. La teoria della SIGPIPE era falsa — il difetto reale era
      # accettare un trasferimento interrotto.
      - name: Smoke test the packaged app
        shell: bash
        run: |
          set -eu
          bun run server/cli.ts --no-window --port 8899 --data-dir "$RUNNER_TEMP/zapp-smoke" &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            if curl --max-time 5 -fsS http://127.0.0.1:8899/health > /dev/null; then break; fi
            sleep 1
          done

          curl --max-time 5 -fsS http://127.0.0.1:8899/health
          curl --max-time 5 -fsS -o "$RUNNER_TEMP/zapp-page.html" http://127.0.0.1:8899/
          grep -q "<!doctype html" "$RUNNER_TEMP/zapp-page.html"

          kill "$server_pid"
          wait "$server_pid" 2>/dev/null || true

  check-windows:
    name: Tests, types and package (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Tests (server + contract, no network)
        run: bun test

      - name: Typecheck (interface and server)
        run: bun run typecheck

      # `clean.ts` and `copy-static.ts` exist because `rmSync` misbehaves on
      # Windows (OneDrive folders): exercise them on a Windows runner, not only
      # on Linux. `prepack` = `build`, which compiles into `dist-new/`, commits
      # it with a rename, then refreshes `static/` the same way.
      - name: Build the distributed package layout
        run: bun run prepack

      # Ciò che il pacchetto pubblicato deve contenere davvero.
      - name: Verify the package layout
        shell: bash
        run: |
          set -eu
          test -f static/index.html
          test -f server/cli.ts
