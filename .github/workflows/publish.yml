name: Publish to npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  npm:
    name: Publish the package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # richiesto da `npm publish --provenance`
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # Node serve solo a `npm publish`. `static/` **non** è nel repository
      # (`static/` è in .gitignore): lo produce lo step "Build the package
      # layout" qui sotto, con una `bun run prepack` esplicita.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Nessuna build qui: la costruisce, una volta sola, lo step "Build the
      # package layout" più sotto.
      - name: Tests and typecheck
        run: |
          bun test
          bun run typecheck

      # Un tag che non corrisponde a `package.json` pubblicherebbe una versione
      # diversa da quella che il tag annuncia. Vale anche per `workflow_dispatch`:
      # la pubblicazione va lanciata dal tag `v<versione>`.
      - name: Check the tag matches package.json
        run: |
          version="$(bun -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Ref $GITHUB_REF_NAME does not match the package.json version v$version: tag the release v$version (or bump package.json) and run this workflow from that tag."
            exit 1
          fi

      - name: Build the package layout
        run: bun run prepack

      # Il tarball si verifica **prima** di pubblicarlo. `--ignore-scripts`
      # perché la build è appena stata fatta: qui serve solo l'elenco dei file
      # che finirebbero nel pacchetto. `--json` perché `npm pack` scrive
      # l'elenco dei file su stderr e su stdout solo il nome del tarball.
      - name: Verify the tarball ships the interface
        run: |
          npm pack --dry-run --ignore-scripts --json > "$RUNNER_TEMP/zapp-pack.json"
          grep -q "static/index.html" "$RUNNER_TEMP/zapp-pack.json"

      # Un tag senza segreto non è un successo: senza token la pubblicazione
      # non parte e il workflow deve dirlo, non uscire con 0.
      #
      # `--ignore-scripts` perché `npm publish` da solo rilancerebbe il lifecycle
      # `prepack` (= `bun run build`) e quindi una **seconda** build: la layout è
      # già stata costruita dallo step precedente e il tarball è già stato
      # verificato, quindi qui si pubblica esattamente quel pacchetto, con
      # **una sola** build per l'intero workflow.
      - name: Publish (with provenance)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN is not configured: the npm publish cannot run. Add the repository secret NPM_TOKEN (an npm automation token with publish rights) and re-run this workflow."
            exit 1
          fi
          npm publish --ignore-scripts --provenance --access public
