name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-portable:
    name: Windows portable build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Tests and typecheck
        run: |
          bun test
          bun run typecheck

      - name: Build the interface and compile the executable
        run: bun run compile

      - name: Assemble the distributable folder
        shell: pwsh
        run: |
          $config = Get-Content package.json -Raw | ConvertFrom-Json
          $staging = "release-assets"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          New-Item -ItemType Directory -Force -Path "$staging/portable" | Out-Null
          Copy-Item dist-exe/ice.exe "$staging/portable/"
          Copy-Item -Recurse static "$staging/portable/"
          $zip = "$staging/ItalianCapacityExplorer_$($config.version)_x64-portable.zip"
          Compress-Archive -Path "$staging/portable/*" -DestinationPath $zip -CompressionLevel Optimal
          # manifest delle impronte: chi scarica verifica senza rifare il build
          $lines = Get-ChildItem "$staging/*.zip" | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          $lines | Set-Content "$staging/SHA256SUMS.txt"
          Get-Content "$staging/SHA256SUMS.txt"

      # Facoltativo: firma il binario prima di pubblicare.
      # Serve un certificato (vedi docs/signing.md) esportabile come .pfx:
      #   secret SIGNING_PFX_BASE64, SIGNING_PFX_PASSWORD, variabile SIGNING_ENABLED=true
      - name: Sign the executable
        if: vars.SIGNING_ENABLED == 'true'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          $path = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:PFX_BASE64))
          $secure = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $secure
          Remove-Item $path
          & "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" sign /sha1 $cert.Thumbprint /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 release-assets/portable/ice.exe
          & "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" verify /pa release-assets/portable/ice.exe

      - name: Upload the build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: release-assets/*
          if-no-files-found: error

      - name: Publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: .github/release-notes.md
          files: release-assets/*
