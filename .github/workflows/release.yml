name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    env:
      # Repository variable (Settings → Secrets and variables → Actions → Variables).
      # Set SIGNING_ENABLED=true and SIGNING_THUMBPRINT, plus the two secrets
      # below, to publish signed installers. See docs/signing.md.
      TAURI_BUNDLE_WINDOWS_CERTIFICATE_THUMBPRINT: ${{ vars.SIGNING_THUMBPRINT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          npm ci
          pip install -e "backend[dev]"

      - name: Backend tests
        run: python -B -m pytest backend/tests -p no:cacheprovider

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Build the backend sidecar
        working-directory: backend
        shell: pwsh
        run: |
          python -B -m PyInstaller app-backend.spec --noconfirm --distpath dist --workpath build
          robocopy dist\app-backend ..\src-tauri\bin\app-backend /MIR

      - name: Import the code-signing certificate
        if: vars.SIGNING_ENABLED == 'true'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          $path = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:PFX_BASE64))
          $secure = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $secure | Out-Null
          Remove-Item $path

      - name: Build the installer
        run: npx tauri build

      - name: Package the portable build
        shell: pwsh
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $release = "src-tauri/target/release"
          $portable = Join-Path $release "portable"
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item (Join-Path $release "app.exe") $portable
          Copy-Item (Join-Path $release "bin") $portable -Recurse
          $zip = Join-Path $release ("{0}_{1}_x64-portable.zip" -f $config.productName, $config.version)
          Compress-Archive -Path (Join-Path $portable "*") -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "portable: $zip"

      - name: Verify the signature
        if: vars.SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          $setup = Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" | Select-Object -First 1
          & "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" verify /pa /v $setup.FullName

      - name: Normalise the asset names
        shell: pwsh
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $slug = ($config.productName -replace '\s+', '')
          $release = "src-tauri/target/release"
          $staging = Join-Path $release "assets"
          Remove-Item $staging -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          $installer = Get-ChildItem "$release\bundle\nsis\*.exe" | Where-Object { $_.Name -like "$($config.productName)*" } | Select-Object -First 1
          if (-not $installer) { throw "no installer for $($config.productName) found" }
          $setup = Join-Path $staging ("{0}_{1}_x64-setup.exe" -f $slug, $config.version)
          Copy-Item $installer $setup
          $portableSource = Join-Path $release ("{0}_{1}_x64-portable.zip" -f $config.productName, $config.version)
          $portableTarget = Join-Path $staging ("{0}_{1}_x64-portable.zip" -f $slug, $config.version)
          Copy-Item $portableSource $portableTarget
          Get-ChildItem $staging | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            Add-Content -Path (Join-Path $staging "SHA256SUMS.txt") -Value "$hash  $($_.Name)"
          }
          Get-Content (Join-Path $staging "SHA256SUMS.txt")

      - name: Upload the installer (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/*-portable.zip
          if-no-files-found: error

      # --- Free trusted signing (SignPath Foundation) -------------------------
      # Uncomment, fill in the slugs, add the SIGNPATH_API_TOKEN repository
      # secret, and publish `signed/` instead of the unsigned artifact above.
      # Requirements and approval flow: docs/signing.md → Option A.
      #
      # - name: Submit the installer for signing
      #   uses: signpath/github-action-submit-signing-request@v3
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: "<SignPath organization id>"
      #     project-slug: "italian-capacity-explorer"
      #     signing-policy-slug: "release-signing"
      #     github-artifact-id: ${{ steps.upload-unsigned-artifact.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: "signed"
      #
      # Note: the step above needs the artifact id, so give the upload step an
      # id (`id: upload-unsigned-artifact`) — SignPath signs artifacts that were
      # uploaded through actions/upload-artifact v4+.

      - name: Upload the backend sidecar (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: backend-sidecar-windows
          path: src-tauri/bin/app-backend/**
          if-no-files-found: error

      - name: Publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: .github/release-notes.md
          files: src-tauri/target/release/assets/*
