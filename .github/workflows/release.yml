name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    env:
      # Repository variable (Settings → Secrets and variables → Actions → Variables).
      # Set SIGNING_ENABLED=true and SIGNING_THUMBPRINT, plus the two secrets
      # below, to publish signed installers. See docs/signing.md.
      TAURI_BUNDLE_WINDOWS_CERTIFICATE_THUMBPRINT: ${{ vars.SIGNING_THUMBPRINT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          npm ci
          pip install -e "backend[dev]"

      - name: Backend tests
        run: python -B -m pytest backend/tests -p no:cacheprovider

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Build the backend sidecar
        working-directory: backend
        shell: pwsh
        run: |
          python -B -m PyInstaller app-backend.spec --noconfirm --distpath dist --workpath build
          robocopy dist\app-backend ..\src-tauri\bin\app-backend /MIR

      - name: Import the code-signing certificate
        if: vars.SIGNING_ENABLED == 'true'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          $path = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:PFX_BASE64))
          $secure = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $secure | Out-Null
          Remove-Item $path

      - name: Build the installer
        run: npx tauri build

      - name: Verify the signature
        if: vars.SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          $setup = Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" | Select-Object -First 1
          & "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" verify /pa /v $setup.FullName

      - name: Upload the installer (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload the backend sidecar (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: backend-sidecar-windows
          path: src-tauri/bin/app-backend/**
          if-no-files-found: error

      - name: Publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: src-tauri/target/release/bundle/nsis/*.exe
