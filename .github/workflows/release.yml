name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # L'eseguibile è il prodotto che si scarica dalla release: va costruito e
  # impacchettato su Windows (dove gira) prima di annunciare la release.
  build-exe:
    name: Build the Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `compile` = `prepack` (build + `static/`) + copia di `static/` accanto
      # all'eseguibile + `bun build --compile`. Produce `dist-exe/ice.exe` e
      # `dist-exe/static/`, cioè un eseguibile che serve davvero l'interfaccia.
      - name: Build the executable
        run: bun run compile

      - name: Package the release assets (zip + checksums)
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $zip = "Italian-Renewable-Capacity-Explorer-$version-win-x64.zip"
          Compress-Archive -Path dist-exe/* -DestinationPath $zip -Force

          $sums = foreach ($asset in @("dist-exe/ice.exe", $zip)) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $asset).Hash.ToLower()
            "$hash  $(Split-Path $asset -Leaf)"
          }
          Set-Content -Path SHA256SUMS.txt -Value $sums -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Upload the release assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            dist-exe/ice.exe
            Italian-Renewable-Capacity-Explorer-*-win-x64.zip
            SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: Draft the GitHub release
    needs: build-exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Tests, typecheck and interface build
        run: |
          bun test
          bun run typecheck
          bun run build

      - name: Download the executable built on Windows
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: release-assets

      # L'intestazione `## Version X.Y.Z` di `.github/release-notes.md` è il
      # titolo della release: se non corrisponde a `package.json` il corpo
      # annuncerebbe una versione diversa da quella pubblicata (stesso schema
      # del guard sul tag in publish.yml). Il file si legge e basta.
      - name: Check the release notes version matches package.json
        run: |
          version="$(bun -p 'require("./package.json").version')"
          heading="$(sed -n 's/^## Version //p' .github/release-notes.md | head -n 1 | tr -d '\r')"
          if [ "$heading" != "$version" ]; then
            echo "::error::.github/release-notes.md says \"## Version $heading\" but package.json is version $version: update the heading to \"## Version $version\" (or bump package.json) and re-run this workflow."
            exit 1
          fi

      # `body_path` resta il corpo curato a mano; `generate_release_notes`
      # aggiunge in coda le note automatiche del tag (PR e commit), così due
      # release consecutive non hanno più lo stesso testo.
      - name: Publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: .github/release-notes.md
          generate_release_notes: true
          files: |
            release-assets/dist-exe/ice.exe
            release-assets/Italian-Renewable-Capacity-Explorer-*-win-x64.zip
            release-assets/SHA256SUMS.txt
