<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Italian Installed Power Plants Explorer</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2fd98f"/>
      <stop offset="1" stop-color="#076048"/>
    </linearGradient>
  </defs>
  <!-- Rounded tile: radius 22.5% keeps the silhouette stable down to 16 px -->
  <rect width="1024" height="1024" rx="230" fill="url(#tile)"/>
  <!-- Three ascending bars: installed capacity over time.
       Content box y 206..818, x 240..784 — optically centred, >20% safe area. -->
  <g fill="#ffffff">
    <rect x="240" y="530" width="152" height="288" rx="76"/>
    <rect x="436" y="374" width="152" height="444" rx="76"/>
    <rect x="632" y="206" width="152" height="612" rx="76"/>
  </g>
</svg>
